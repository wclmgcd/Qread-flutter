name: Build Web

# 出「网页版」客户端的**验证**工作流。
#
# ============================================================
# 先看定位，别和部署搞混
# ============================================================
# 网页版产物最终要放进**后端仓库**的 `src/main/resources/static/` ——
# 浏览器打开后端站点时，跑的就是那个目录里的 main.dart.js。
#
# 但产物只能在**有 Flutter 源码的地方**构建：后端仓库里一个 .dart 文件都没有，
# 只有编好的 JS（等于手上只有 .jar 没有 .java），在那儿根本没法 `flutter build`。
# 所以构建和部署被分在两个仓库：
#
#   本文件（Qread-flutter/.github/workflows/web.yml）
#       → 改前端代码时自动跑，**只验证能不能编过**
#   read/.github/workflows/build-web.yml
#       → 真出产物 + 直接覆盖 static/ + 提交（在后端仓库点一次按钮即可）
#
# 也就是说：**部署不用再回这个仓库下载 zip 了**。本工作流留着，是为了在 push
# 时尽早发现「编不过」—— 这次 Web 构建失败（64 位整数字面量）就是它抓到的。
# 想手动拿一份产物来检查，仍然可以跑本工作流并下载 `qread-web`。
#
# 【为什么必须自己出一份网页版】
# 后端 static 里那份是官方编译产物：它的浏览历史 / 搜索历史只写浏览器本地的
# IndexedDB，一个历史接口都不调，所以后端加多少接口都不会同步。
# 想让它认识 `/getBrowsingHistory` 这些接口，只能**换掉那份 JS**。
#
# 【注意】这份产物会取代官方网页版的界面（包括它那颗「清理历史记录」），
# 换来的是「浏览器端和安卓 / iOS / Windows 同账号同后端可以同步历史」。
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本 (留空则用默认 3.41.9)'
        required: false
        default: '3.41.9'
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/web.yml'

jobs:
  web:
    name: Build web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.41.9' }}
          channel: stable
          cache: true

      - name: Flutter / Dart 版本
        run: |
          flutter --version
          dart --version

      - name: flutter pub get
        run: flutter pub get

      # 【analyze 不阻塞，但 build 必须过】
      # 本地没装 Flutter SDK 时，只有这一步能查出「平台相关的编译错误」。
      #
      # ⚠️ 先纠正一个常见误判：`dart:io` 在 Web 上**是能编过的**（用到才运行时
      #    报错），不会报 "Dart library 'dart:io' is not available on this
      #    platform"。真正**编译期**就炸的是另外两类：
      #      1. 64 位整数字面量 —— dart2js 的 int 就是 IEEE-754 双精度，安全
      #         整数只有 53 位，`0xcbf29ce484222325` 这种直接被拒：
      #           Error: The integer literal 0x... can't be represented
      #           exactly in JavaScript.
      #      2. `dart:html` / `package:web` —— 这两个反过来在**原生端**编不过。
      #    push 前可以先本地 grep 一遍（见 flutter-dart-local-validation 技能第 13 节）。
      - name: flutter analyze (不阻塞)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      # 【为什么加这一步】`test/` 下三个文件（净化引擎 39 项、登录页排版 12 项、
      # 占位 1 项）都是**纯 Dart 逻辑**，不依赖设备、不依赖网络、跑起来不到 1 秒，
      # 却能在 push 时立刻拦住「改了模型/引擎但没改测试」这类回归。
      # 净化引擎那份尤其值：它把「Dart 的 replaceAll 不展开 $1」这类**静默失效**
      # 的坑钉成了断言 —— 没有测试就只能靠肉眼看正文，看不出错。
      - name: flutter test
        run: flutter test

      - name: flutter build web
        run: flutter build web --release --base-href /

      - name: 产物信息
        run: |
          du -sh build/web
          ls -lh build/web | head -20

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: qread-web
          path: build/web
          if-no-files-found: error
