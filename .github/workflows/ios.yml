name: Build iOS IPA (unsigned)

# 产出的是**未签名 IPA**，用来自签后安装（Sideloadly / 爱思助手 / AltStore / TrollStore 等）。
#
# 为什么不做签名：
#   签名需要 Apple 开发者账号的证书(.p12) + provisioning profile，都是私密凭据，
#   塞进仓库或 CI secrets 既麻烦又不安全。而自签工具（Sideloadly 之类）本来就会
#   用你自己的 Apple ID 重新签一遍 —— 它会把 IPA 里主 App 和所有内嵌 framework
#   的签名全部覆盖，所以 CI 端签不签没有区别。
#
# 为什么跑在 macOS 上：
#   iOS 打包必须 Xcode，Windows / Linux 连 `flutter build ios` 都执行不了。
#
# 触发方式：
#   1. 手动 (workflow_dispatch) —— 推荐，可指定 Flutter 版本重试
#   2. push 到 main，且改动落在 ios/ 或本文件
#
# 为什么 push 不监听 lib/：
#   GitHub 对 macOS runner 的计费倍率是 Linux 的 10 倍。私有仓库每月 2000 分钟
#   免费额度，换算到 macOS 只有 200 分钟 —— 一次 iOS 构建约 15 分钟，若监听
#   lib/ 每次提交都跑，十几次就烧完了。要出包时手动点一下更划算。
#   确实想每次 push 都出包的话，把下面 paths 里的 'lib/**' 和 'pubspec.yaml' 加回来。
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本 (留空则用默认 3.41.9)'
        required: false
        default: '3.41.9'
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

# 同一分支重复触发时取消前一次，别白烧 macOS 分钟数
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    # macos-latest 目前是 Apple Silicon (arm64)，自带 Xcode 和 CocoaPods。
    # 若某天 latest 切到更新的 macOS 导致 Xcode 太新编不过，把这里改成
    # 固定版本（如 macos-15）重试即可。
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.41.9' }}
          channel: stable
          cache: true

      # 版本不匹配时看这里最快
      - name: Flutter / Xcode / CocoaPods 版本
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version
          echo "--- flutter doctor ---"
          flutter doctor -v || true

      - name: flutter pub get
        run: flutter pub get

      # analyze 只做参考，不阻塞出包（与 android.yml 保持一致）
      - name: flutter analyze (不阻塞)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      # CocoaPods 的 spec 缓存，第二次跑能省几分钟
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: pod install
        working-directory: ios
        run: pod install

      # --no-codesign 跳过签名，产出未签名的 build/ios/iphoneos/Runner.app
      - name: flutter build ios (无签名)
        run: flutter build ios --release --no-codesign

      # 把 Runner.app 放进标准的 Payload/ 目录再 zip 成 .ipa
      #
      # zip 的两个参数很关键：
      #   -y  保留符号链接。framework 内部用符号链接维护版本目录结构，
      #       不加 -y 会被解引用成实体文件，包体积暴涨且自签工具可能报错。
      #   -X  不写入 macOS 的额外文件属性（资源 fork / __MACOSX），
      #       iOS 侧不需要，留着只会让自签工具困惑。
      - name: 打包成未签名 IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"

          rm -rf /tmp/ipa
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/

          # 清掉所有残留的签名痕迹（主 App + Frameworks 里每个 framework 各一份）。
          # 留着的话，部分自签工具会以为「这包已经签过了」而跳过重签，装上直接闪退。
          find /tmp/ipa/Payload -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find /tmp/ipa/Payload -type f -name "embedded.mobileprovision" -delete 2>/dev/null || true

          cd /tmp/ipa
          zip -qryX "$GITHUB_WORKSPACE/Qread-unsigned.ipa" Payload -x "*.DS_Store"

      - name: 产物信息
        run: |
          ls -lh Qread-unsigned.ipa
          echo "--- 包内结构(前 20 行) ---"
          unzip -l Qread-unsigned.ipa | head -20
          echo "--- Info.plist 关键项 ---"
          P=build/ios/iphoneos/Runner.app/Info.plist
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '%s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$P" 2>/dev/null || echo "(未设置)"
          done

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: qread-ipa-unsigned
          path: Qread-unsigned.ipa
          if-no-files-found: error

      # 编译失败时带上 archive 产物，方便定位（stdout 里也有 xcodebuild 的完整输出）
      - name: Upload 构建日志 (仅失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/ios/archive/
            ios/Pods/Target Support Files/
          if-no-files-found: ignore
