name: qread
description: Qread - 阅读3.0 Flutter客户端
publish_to: 'none'
version: 1.0.0+1

environment:
  # 上游仓库里写的是 ">=2.17.0 <3.0.0"(Dart 2), 但下面的依赖
  # (webview_flutter 4.x / battery_plus 6.x / flutter_tts 4.x / file_selector 1.x)
  # 全部要求 Dart 3 —— 那个约束会让 `flutter pub get` 直接 version solving failed。
  # 作者本地显然放宽过但没提交, 这里修正为 Dart 3。
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.3
  # dio 4.x 最高只到 4.0.6, 其 sdk 约束是 >=2.12.1 <3.0.0 —— 不支持 Dart 3。
  # dio 5 仍保留 Headers.jsonContentType 等常量, 本仓库的用法只需把
  # connectTimeout / receiveTimeout 从 int 改成 Duration。
  dio: ^5.7.0
  # 跨平台 WebSocket（段评推送 / 书源调试用的长连接）。
  # 【为什么必须用它而不是 dart:io 的 WebSocket】
  # dart:io 在 Web 上不存在，直接用会让 `flutter build web` 编译期失败，
  # 整个项目就出不了网页版。web_socket_channel 是 Dart 官方维护的封装：
  # 原生端底下仍是 dart:io 的 WebSocket（行为不变），Web 端换成浏览器的
  # WebSocket，业务代码只写一份。详见 lib/services/reader_ws_service.dart。
  web_socket_channel: ^3.0.0
  # 本地缓存 key 的摘要（见 lib/services/local_cache_service.dart 的 scopedKey）。
  # 【为什么显式声明】它本来就作为 web_socket_channel 的传递依赖在依赖树里，
  # 但既然代码里直接 import 了 package:crypto，就应该按直接依赖声明 ——
  # 否则哪天 web_socket_channel 换掉这个依赖，构建会毫无征兆地断掉。
  crypto: ^3.0.0
  shared_preferences: ^2.0.15
  cached_network_image: ^3.2.1
  # 上游写的是 ^3.0.0-alpha.3, 那是 Dart 2 时代的 alpha; 3.0.0 正式版要求 >=3.2.0。
  flutter_html: ^3.0.0
  # 【本 fork 补丁 · 必须钉死, 不能写成 ^0.15.6】
  # flutter_html 3.0.0 的 lib/src/tree/styled_element.dart:7 直接 import 了
  # html 包的私有内部文件 `package:html/src/query_selector.dart`, 并在第 31 行调用
  # 它的顶层函数 `qs.matches(element, selector)`。
  # 它自己也知道这是隐患, 源码里留着注释:
  #   //TODO(Sub6Resources): don't use the internal code of the html package as it may change unexpectedly.
  # 结果这个 TODO 应验了 —— html 0.15.7 (2026-08-28 发布) 把那个顶层 matches() 删了,
  # 只留下 SelectorEvaluator.matches 这个成员方法, 于是 `flutter build` 报:
  #   Error: Method not found: 'matches'.   return qs.matches(element, selector);
  # flutter_html 声明的是 html: ^0.15.5, pub 会解析到最新的 0.15.7 -> 必炸。
  #
  # 0.15.6 (2025-04-24) 是最后一个仍带顶层 matches() 的版本 (见其 query_selector.dart 第 10 行),
  # 且它的 sdk 约束是 ^3.2.0, 兼容当前 Dart 3.11.5。
  # 已核实: 全部 141 个解析出的依赖里, 只有 flutter_html 依赖 html, 钉版本不会冲突。
  # 上游 flutter_html 修掉这行 import 之后, 本行即可删除。
  html: 0.15.6
  webview_flutter: ^4.13.1
  # 已移除 webview_windows: ^0.4.0 —— 唯一版本 0.4.0 的 sdk 约束是
  # >=2.13.0 <3.0.0, 不支持 Dart 3, 而且它只服务 Windows 端。本 fork 只出 Android。
  url_launcher: ^6.1.3
  path_provider: ^2.0.11
  sqflite: ^2.0.2+1
  json_annotation: ^4.5.0
  flutter_tts: ^4.2.2
  # 「我的 → 朗读引擎」里配的是 legado 格式的 **HTTP TTS 引擎**：真正发声的是
  # 后端 `/tts` 合成出来的音频流，系统 TTS（flutter_tts）播不了这种 URL。
  # 所以阅读页的「朗读引擎」要能选它们，就必须再带一个音频播放器。
  # audioplayers 只做「给一个 URL 就播」，Android/iOS 都不需要额外原生配置。
  audioplayers: ^6.0.0
  battery_plus: ^6.2.2
  file_selector: ^1.0.3
  # 已移除 pull_to_refresh: ^2.0.0 —— 该包已停维护且 sdk 锁 <3.0.0;
  # 代码里也没有任何地方 import 它。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.1.11
  json_serializable: ^6.2.0

flutter:
  uses-material-design: true

  # 阅读器内置中文字体（设置面板「字体」一行对应 reader_fonts.dart）
  #
  # 三个字族都是「GB2312 全集 + 常用标点/符号」子集化后的产物，共约 20.9 MB：
  #   ReaderSans  ← Noto Sans SC   (OFL-1.1)  面板「谷歌」= 谷歌思源黑体
  #   ReaderSerif ← Noto Serif SC  (OFL-1.1)  面板「宋体」= 思源宋体
  #   ReaderRound ← 悠哉字体 Yozai  (OFL-1.1)  面板「圆体」= 圆润字体
  # 之所以要内置而不是用系统字体：Android 上不指定 fontFamily 时 Flutter 会按
  # 字符逐个走系统回退字体，同一段正文里会混进黑体/宋体，观感就是「字体不一」。
  #
  # 每个字族都带 400 / 700 两个真实字重文件，「粗细」开关改 FontWeight 即可命中，
  # 不走 Skia 的合成加粗（合成加粗在中文上容易糊）。
  #
  # 子集/实例化流程见 doc/fonts.md，重新生成用 tool/subset_fonts.py，
  # 请勿手改本段文件名。
  fonts:
    - family: ReaderSans
      fonts:
        - asset: assets/fonts/ReaderSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReaderSans-Bold.ttf
          weight: 700
    - family: ReaderSerif
      fonts:
        - asset: assets/fonts/ReaderSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReaderSerif-Bold.ttf
          weight: 700
    - family: ReaderRound
      fonts:
        - asset: assets/fonts/ReaderRound-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReaderRound-Bold.ttf
          weight: 700
