name: qread
description: Qread - 阅读3.0 Flutter客户端
publish_to: 'none'
version: 1.0.0+1

environment:
  # 上游仓库里写的是 ">=2.17.0 <3.0.0"(Dart 2), 但下面的依赖
  # (webview_flutter 4.x / battery_plus 6.x / flutter_tts 4.x / file_selector 1.x)
  # 全部要求 Dart 3 —— 那个约束会让 `flutter pub get` 直接 version solving failed。
  # 作者本地显然放宽过但没提交, 这里修正为 Dart 3。
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.3
  # dio 4.x 最高只到 4.0.6, 其 sdk 约束是 >=2.12.1 <3.0.0 —— 不支持 Dart 3。
  # dio 5 仍保留 Headers.jsonContentType 等常量, 本仓库的用法只需把
  # connectTimeout / receiveTimeout 从 int 改成 Duration。
  dio: ^5.7.0
  shared_preferences: ^2.0.15
  cached_network_image: ^3.2.1
  # 上游写的是 ^3.0.0-alpha.3, 那是 Dart 2 时代的 alpha; 3.0.0 正式版要求 >=3.2.0。
  flutter_html: ^3.0.0
  webview_flutter: ^4.13.1
  # 已移除 webview_windows: ^0.4.0 —— 唯一版本 0.4.0 的 sdk 约束是
  # >=2.13.0 <3.0.0, 不支持 Dart 3, 而且它只服务 Windows 端。本 fork 只出 Android。
  url_launcher: ^6.1.3
  path_provider: ^2.0.11
  sqflite: ^2.0.2+1
  json_annotation: ^4.5.0
  flutter_tts: ^4.2.2
  battery_plus: ^6.2.2
  file_selector: ^1.0.3
  # 已移除 pull_to_refresh: ^2.0.0 —— 该包已停维护且 sdk 锁 <3.0.0;
  # 代码里也没有任何地方 import 它。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.1.11
  json_serializable: ^6.2.0

flutter:
  uses-material-design: true
